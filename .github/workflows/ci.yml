name: CI

on:
  pull_request:
    branches: [main]
  push:
    # Also run on claude/** pushes: a PR opened by auto-pr.yml via GITHUB_TOKEN
    # does not fire pull_request checks, so we attach the checks to the branch
    # commit here — they then show up on the PR via its head SHA.
    branches: [main, 'claude/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck
        run: npm run typecheck --workspace apps/web

      - name: Lint
        run: npm run lint --workspace apps/web
