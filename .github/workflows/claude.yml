name: Claude Code

on:
  issues:
    types: [opened, assigned, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    # Only run when "@claude" is mentioned in the text OR the "claude" label is set.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (
        contains(github.event.issue.body, '@claude') ||
        contains(github.event.issue.title, '@claude') ||
        contains(github.event.issue.labels.*.name, 'claude') ||
        github.event.label.name == 'claude'
      ))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install deps up front so Claude can run typecheck/lint against a ready
      # node_modules instead of trying (and failing) to install on the fly.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Auth via Claude Pro/Max subscription (OAuth token), not pay-as-you-go
          # API credits. Generate locally with `claude setup-token` and store the
          # result in the CLAUDE_CODE_OAUTH_TOKEN repo secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No `prompt` -> interactive mode: Claude responds to @claude mentions
          # and acts on the issue / comment context.
          # --allowedTools grants Claude permission to run the project checks
          # (added on top of the action's built-in git/comment tools).
          claude_args: |
            --model claude-opus-4-8
            --max-turns 40
            --allowedTools "Bash(npm run typecheck:*),Bash(npm run lint:*),Bash(npm run build:*)"
